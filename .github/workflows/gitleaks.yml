name: gitleaks

# Secret-scanning on every push and PR. We install the upstream gitleaks
# binary directly instead of using `gitleaks/gitleaks-action@v2` because
# that action now requires a paid commercial license for non-OSS use
# (it fails with "missing gitleaks license. Go grab one at gitleaks.io").
# The binary is OSS and runs the same scan, so we get the same coverage
# without the licensing surface.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history so it can detect secrets that
          # were added in any commit, not just the current tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # Use `detect` with explicit exit code so the job fails when
        # secrets are found. `--no-banner` keeps the log readable.
        # `--config` points at the repo-local allowlist for verified
        # false-positives (browser-storage key names misidentified as
        # API keys by the generic-api-key rule).
        run: gitleaks detect --source . --no-banner --verbose --redact --config .gitleaks.toml
