name: electron-release

# Auto-builds the Electron desktop bundles (Linux AppImage + Windows NSIS)
# and attaches them to a GitHub Release. The README "Latest release" /
# "Downloads" badges already point at the Releases tab, so a properly
# wired-up release flow is the only thing standing between the badges
# and reality.
#
# Triggers:
#   - Push of a `v*` tag (e.g. `v1.0.0`) — the canonical release flow.
#   - workflow_dispatch — manual rebuilds for tag amendments or for
#     spot-checks before tagging.
#
# Why two jobs?
#   electron-builder produces a Windows NSIS installer most reliably on a
#   real Windows runner (Wine cross-build works but emits unsigned
#   binaries with subtle DLL pathing differences). Linux/AppImage builds
#   on ubuntu-latest natively. Running both in parallel keeps total
#   wall-clock under ~6 minutes.
#
# Code-signing:
#   Neither artifact is code-signed. macOS notarisation and Windows
#   Authenticode require paid certificates that this OSS project does
#   not hold. The README "Downloads" section documents this so users
#   aren't surprised by the SmartScreen / Gatekeeper warnings on first
#   launch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to upload assets to the Release

jobs:
  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build AppImage
        run: npm run electron:build
      - name: Collect artifact
        run: |
          mkdir -p dist-release
          cp release/*.AppImage dist-release/ 2>/dev/null || true
          cp release/latest-linux.yml dist-release/ 2>/dev/null || true
          ls -lh dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build NSIS installer
        run: npm run electron:build:win
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist-release
          cp release/*.exe dist-release/ 2>/dev/null || true
          cp release/latest.yml dist-release/ 2>/dev/null || true
          ls -lh dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release/
      - name: Flatten artifact dirs
        run: |
          mkdir -p flat
          find dist-release -type f \( -name '*.AppImage' -o -name '*.exe' -o -name 'latest*.yml' \) -exec cp {} flat/ \;
          ls -lh flat/
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: flat/*
          fail_on_unmatched_files: true
          generate_release_notes: true
