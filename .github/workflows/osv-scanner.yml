name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

# Installs the OSV-Scanner Go binary directly and runs it against the
# project root. The previous revision used google/osv-scanner-action's
# reusable workflow, which kept failing with "workflow file issue" (no
# usable log) — likely a version-pin mismatch between the wrapper and
# the underlying action. Running the binary ourselves gives a stable,
# debuggable surface.
jobs:
  scan:
    name: Run OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.4

      - name: Run OSV-Scanner
        id: osv-scan
        # Exit code 1 means vulnerabilities were found — we still want
        # the SARIF upload step to run so they surface in the Security
        # tab. `|| true` lets the step succeed; the badge will still
        # turn red on the dashboard via the SARIF severity counts.
        run: |
          osv-scanner --recursive --format=sarif --output=results.sarif ./ || true

      - name: Upload SARIF results
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
