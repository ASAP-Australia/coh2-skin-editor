name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

# Top-level is read-only. The Scorecard webapp upload rejects runs where
# any write permission is declared at the workflow level — the previous
# revision set `security-events: write` here and the OIDC sigstore step
# failed with HTTP 400: "global perm is set to write". Per
# ossf/scorecard-action's workflow-restrictions doc, write perms must be
# scoped to the job that needs them.
permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to the security tab.
      security-events: write
      # Needed for the OIDC token for the scorecard action.
      id-token: write
      # Needed by scorecard to read GitHub Actions workflow metadata.
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
