name: Feature request
description: Suggest an idea for the editor.
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the workflow you're trying to do today, and where it breaks down. ("I want to... but the editor doesn't...")
        Focus on the *problem*, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like the editor to behave. Sketches, screenshots, or references to other apps are very welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why you think your proposal is the best one.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Related issues, links to similar features in other tools, etc.
