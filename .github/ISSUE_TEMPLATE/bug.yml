name: Bug report
description: Something isn't working. File a bug so we can investigate and fix it.
title: '[Bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you can give us, the faster we can fix it.

        For security vulnerabilities, please follow [SECURITY.md](https://github.com/ASAP-australia/coh2-skin-editor/blob/main/SECURITY.md) instead of filing a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen, and what happened instead?
      placeholder: When I... I expected... but instead...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably trigger the bug.
      placeholder: |
        1. Open the editor
        2. Click...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build?
      options:
        - Web (asap-australia.github.io)
        - Electron (Windows)
        - Electron (macOS)
        - Electron (Linux AppImage)
        - Self-hosted / dev build
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "Shown in the app's About panel (or the Electron window title). Example: `1.0.0`."
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (web build only)
      description: 'Browser name and version. Example: `Chrome 138 / Firefox 142 / Safari 18`.'
      placeholder: 'Chrome 138'

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Windows 11 / macOS 15.2 / Fedora 41'
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser DevTools console output
      description: |
        Open DevTools (F12) → Console tab. Copy any red errors or yellow warnings that appeared when the bug happened.
        Wrap in a `<details>` block if it's long.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, related issues, install path quirks, modded CoH2 install, etc.
